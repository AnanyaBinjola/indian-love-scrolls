<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad2" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#fdf6eb"/>
      <stop offset="70%" stop-color="#f2e2c4"/>
      <stop offset="100%" stop-color="#dec69a"/>
    </radialGradient>
    <radialGradient id="twilightGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fed993"/>
      <stop offset="35%" stop-color="#e28c52"/>
      <stop offset="70%" stop-color="#472648"/>
      <stop offset="100%" stop-color="#1d132b"/>
    </radialGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeaab"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6814"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad2)"/>

  <!-- Ornate Frame -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="url(#goldGrad2)" stroke-width="6"/>
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#5a2d5e" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="46" y="46" width="708" height="508" fill="none" stroke="url(#goldGrad2)" stroke-width="1.5"/>

  <!-- Corner Ornaments -->
  <g fill="url(#goldGrad2)">
    <path d="M 46,46 Q 90,50 110,90 Q 70,80 46,46 Z"/>
    <path d="M 754,46 Q 710,50 690,90 Q 730,80 754,46 Z"/>
    <path d="M 46,554 Q 90,550 110,510 Q 70,520 46,554 Z"/>
    <path d="M 754,554 Q 710,550 690,510 Q 730,520 754,554 Z"/>
  </g>

  <!-- Main Painting -->
  <g transform="translate(60, 60)">
    <rect width="680" height="480" fill="url(#twilightGrad)" rx="4"/>

    <!-- Mewar Palace Jharokhas & Arches -->
    <g fill="#2e1533" opacity="0.9">
      <!-- Ornate Cusped Mughal-Rajput Arches -->
      <path d="M 0,0 L 0,220 Q 80,180 140,240 Q 200,180 280,220 L 280,0 Z"/>
      <path d="M 400,0 L 400,220 Q 480,180 540,240 Q 600,180 680,220 L 680,0 Z"/>
    </g>
    <!-- Gold Arch Outlines -->
    <path d="M 0,220 Q 80,180 140,240 Q 200,180 280,220" stroke="url(#goldGrad2)" stroke-width="3" fill="none"/>
    <path d="M 400,220 Q 480,180 540,240 Q 600,180 680,220" stroke="url(#goldGrad2)" stroke-width="3" fill="none"/>

    <!-- Moon & Starry Sky in Courtyard -->
    <circle cx="340" cy="110" r="30" fill="#fff5d6" filter="url(#glow2)"/>
    <circle cx="340" cy="110" r="38" fill="url(#goldGrad2)" opacity="0.25"/>

    <!-- Peacock with vibrant feathers perched on palace balcony -->
    <g transform="translate(540, 160)">
      <path d="M 0,0 Q 20,-20 40,-10 Q 50,20 10,60 Z" fill="#0077b6"/>
      <circle cx="42" cy="-12" r="7" fill="#0096c7"/>
      <!-- Feathers -->
      <path d="M 10,60 Q 50,110 30,170 Q 0,130 10,60" fill="#2d6a4f"/>
      <ellipse cx="28" cy="130" rx="9" ry="14" fill="#52b788" stroke="url(#goldGrad2)" stroke-width="1.5"/>
      <circle cx="28" cy="130" r="4" fill="#0077b6"/>
    </g>

    <!-- Marble Courtyard Floor -->
    <rect x="0" y="320" width="680" height="160" fill="#221226"/>
    <line x1="0" y1="320" x2="680" y2="320" stroke="url(#goldGrad2)" stroke-width="2"/>

    <!-- Meera Bai in Saffron/Ivory with Ektara -->
    <g transform="translate(320, 270)">
      <!-- Saintly Halo -->
      <circle cx="0" cy="-30" r="45" fill="url(#goldGrad2)" opacity="0.35" filter="url(#glow2)"/>
      <circle cx="0" cy="-30" r="36" fill="none" stroke="url(#goldGrad2)" stroke-width="1"/>

      <!-- Saffron / Cream Devotional Robe -->
      <path d="M -25,20 Q -45,65 -55,105 L 55,105 Q 45,65 25,20 Z" fill="#e76f51"/>
      <path d="M -15,10 Q 0,-15 15,10 Q 0,55 -25,105 Z" fill="#f4a261"/>
      
      <!-- Head & Devotional Expression -->
      <circle cx="0" cy="-30" r="18" fill="#f8d1ab"/>
      <path d="M -18,-32 Q 0,-52 18,-32 Q 10,-20 -18,-32 Z" fill="#221226"/>
      
      <!-- Ektara Single-String Instrument -->
      <line x1="-35" y1="-70" x2="25" y2="85" stroke="#8b4513" stroke-width="4"/>
      <circle cx="20" cy="75" r="16" fill="#a0522d" stroke="url(#goldGrad2)" stroke-width="2"/>
      <line x1="-35" y1="-70" x2="20" y2="75" stroke="url(#goldGrad2)" stroke-width="1"/>
      <circle cx="-35" cy="-70" r="5" fill="url(#goldGrad2)"/>
      <path d="M -30,-50 Q -10,-40 5,-20" stroke="#f8d1ab" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Decorative Caption -->
    <rect x="200" y="440" width="280" height="26" fill="#150819" rx="13" stroke="url(#goldGrad2)" stroke-width="1"/>
    <text x="340" y="458" font-family="'Cinzel', serif" font-size="12" fill="#faeaab" text-anchor="middle" letter-spacing="3">MEERA BAI · MEWAR</text>
  </g>
</svg>
