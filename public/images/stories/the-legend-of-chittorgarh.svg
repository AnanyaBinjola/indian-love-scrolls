<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad3" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#faf2e3"/>
      <stop offset="70%" stop-color="#eedcba"/>
      <stop offset="100%" stop-color="#dec293"/>
    </radialGradient>
    <radialGradient id="desertDusk" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fedaa0"/>
      <stop offset="35%" stop-color="#e27c4d"/>
      <stop offset="75%" stop-color="#842939"/>
      <stop offset="100%" stop-color="#3c101c"/>
    </radialGradient>
    <linearGradient id="goldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faeaab"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b6814"/>
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad3)"/>

  <!-- Ornate Frame -->
  <rect x="24" y="24" width="752" height="552" fill="none" stroke="url(#goldGrad3)" stroke-width="6"/>
  <rect x="36" y="36" width="728" height="528" fill="none" stroke="#782333" stroke-width="2" stroke-dasharray="8,4"/>
  <rect x="46" y="46" width="708" height="508" fill="none" stroke="url(#goldGrad3)" stroke-width="1.5"/>

  <!-- Corner Ornaments -->
  <g fill="url(#goldGrad3)">
    <path d="M 46,46 Q 90,50 110,90 Q 70,80 46,46 Z"/>
    <path d="M 754,46 Q 710,50 690,90 Q 730,80 754,46 Z"/>
    <path d="M 46,554 Q 90,550 110,510 Q 70,520 46,554 Z"/>
    <path d="M 754,554 Q 710,550 690,510 Q 730,520 754,554 Z"/>
  </g>

  <!-- Painting Canvas -->
  <g transform="translate(60, 60)">
    <rect width="680" height="480" fill="url(#desertDusk)" rx="4"/>

    <!-- Chittorgarh Hill & Massive Stone Fortress Silhouette -->
    <!-- Tower of Fame (Kirti Stambha) / Victory Tower -->
    <g fill="#43121d">
      <!-- Vijay Stambha Tower -->
      <polygon points="560,60 550,280 580,280 570,60"/>
      <polygon points="545,60 565,30 585,60"/>
      <rect x="548" y="110" width="34" height="6" fill="url(#goldGrad3)"/>
      <rect x="546" y="170" width="38" height="6" fill="url(#goldGrad3)"/>
      <rect x="544" y="220" width="42" height="6" fill="url(#goldGrad3)"/>
      
      <!-- Fortress Battlements & Palace Domes on Hill -->
      <polygon points="80,180 160,180 180,290 60,290"/>
      <circle cx="120" cy="180" r="30" fill="#43121d"/>
      <path d="M 90,180 Q 120,135 150,180 Z" fill="url(#goldGrad3)" opacity="0.6"/>

      <!-- Hill Ridge -->
      <path d="M 0,280 Q 200,240 400,270 Q 550,250 680,280 L 680,480 L 0,480 Z"/>
    </g>

    <!-- Golden Sun setting over Mewar -->
    <circle cx="280" cy="120" r="32" fill="#fff1c2" filter="url(#glow3)"/>
    <circle cx="280" cy="120" r="42" fill="url(#goldGrad3)" opacity="0.3"/>

    <!-- Palace Jharokha / Terrace in Foreground -->
    <rect x="0" y="320" width="680" height="160" fill="#240a11"/>
    <line x1="0" y1="320" x2="680" y2="320" stroke="url(#goldGrad3)" stroke-width="2"/>

    <!-- Jali Lattice Screen Pattern on Left -->
    <g stroke="url(#goldGrad3)" stroke-width="1" opacity="0.4" fill="none">
      <pattern id="jaliPattern" width="20" height="20" patternUnits="userSpaceOnUse">
        <rect x="0" y="0" width="20" height="20"/>
        <circle cx="10" cy="10" r="6"/>
      </pattern>
      <rect x="20" y="200" width="140" height="120" fill="url(#jaliPattern)"/>
      <path d="M 20,200 Q 90,140 160,200 L 160,320 L 20,320 Z" stroke="url(#goldGrad3)" stroke-width="2"/>
    </g>

    <!-- Rani Padmini Royal Rajput Silhouette -->
    <g transform="translate(340, 270)">
      <!-- Royal Halo -->
      <circle cx="0" cy="-40" r="40" fill="url(#goldGrad3)" opacity="0.35" filter="url(#glow3)"/>
      
      <!-- Regal Rajput Poshaak (Red/Crimson and Gold) -->
      <path d="M -22,15 Q -45,60 -55,100 L 55,100 Q 45,60 22,15 Z" fill="#9e1b32"/>
      <path d="M -15,5 Q 0,-15 15,5 Q 5,50 -20,100 Z" fill="#c9184a"/>
      <!-- Gold Embroidered Dupatta / Odhni -->
      <path d="M -20,-30 Q -40,10 -30,80 Q -10,95 20,70 Q 30,10 15,-30" stroke="url(#goldGrad3)" stroke-width="2.5" fill="none"/>

      <!-- Face & Borla (Rajput Head Ornament) -->
      <circle cx="0" cy="-40" r="17" fill="#fad2b0"/>
      <path d="M -17,-42 Q 0,-62 17,-42 Q 8,-30 -17,-42 Z" fill="#240a11"/>
      <circle cx="0" cy="-56" r="4" fill="url(#goldGrad3)"/>
      <line x1="0" y1="-56" x2="0" y2="-45" stroke="url(#goldGrad3)" stroke-width="1.5"/>
    </g>

    <!-- Inscription Banner -->
    <rect x="180" y="440" width="320" height="26" fill="#15050a" rx="13" stroke="url(#goldGrad3)" stroke-width="1"/>
    <text x="340" y="458" font-family="'Cinzel', serif" font-size="12" fill="#faeaab" text-anchor="middle" letter-spacing="3">RANI PADMINI · CHITTORGARH</text>
  </g>
</svg>
